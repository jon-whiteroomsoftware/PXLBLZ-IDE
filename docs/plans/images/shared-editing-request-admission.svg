<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace">
  <rect width="720" height="300" fill="#14171c"/>
  <text x="20" y="34" font-size="13" fill="#dde3ea">One request through the live editor: applied is not saved, stale is refused</text>
  <rect x="20" y="46" width="14" height="11" fill="#5c92c7"/><text x="40" y="55" font-size="10" fill="#97a1ac">admission in the tab, serialized</text>
  <rect x="250" y="46" width="14" height="11" fill="#454e59"/><text x="270" y="55" font-size="10" fill="#97a1ac">agent side</text>
  <rect x="350" y="46" width="14" height="11" fill="#6d7681"/><text x="370" y="55" font-size="10" fill="#97a1ac">store settlement</text>

  <rect x="20" y="80" width="110" height="40" fill="#454e59" stroke="#97a1ac"/>
  <text x="30" y="98" font-size="10" fill="#dde3ea">begin_edit</text>
  <text x="30" y="112" font-size="9" fill="#97a1ac">op id, base, context</text>
  <rect x="150" y="80" width="110" height="40" fill="#454e59" stroke="#97a1ac"/>
  <text x="160" y="98" font-size="10" fill="#dde3ea">commands</text>
  <text x="160" y="112" font-size="9" fill="#97a1ac">private candidate</text>
  <rect x="280" y="80" width="110" height="40" fill="#454e59" stroke="#97a1ac"/>
  <text x="290" y="98" font-size="10" fill="#dde3ea">commit_edit</text>
  <text x="290" y="112" font-size="9" fill="#97a1ac">op id + base rev</text>
  <path d="M130 100 L146 100" stroke="#97a1ac"/><path d="M144 96 L150 100 L144 104 Z" fill="#97a1ac"/>
  <path d="M260 100 L276 100" stroke="#97a1ac"/><path d="M274 96 L280 100 L274 104 Z" fill="#97a1ac"/>

  <rect x="410" y="72" width="130" height="56" fill="#2b3a4d" stroke="#5c92c7" stroke-width="1.5"/>
  <text x="420" y="90" font-size="10" fill="#dde3ea">admission</text>
  <text x="420" y="104" font-size="9" fill="#97a1ac">bound? account ok?</text>
  <text x="420" y="116" font-size="9" fill="#97a1ac">base current? id new?</text>
  <path d="M390 100 L406 100" stroke="#97a1ac"/><path d="M404 96 L410 100 L404 104 Z" fill="#97a1ac"/>

  <rect x="410" y="140" width="130" height="30" fill="#1d232b" stroke="#59626d"/>
  <text x="420" y="159" font-size="9" fill="#97a1ac">gesture: wait, bounded</text>
  <path d="M475 128 L475 140" stroke="#59626d"/><path d="M471 138 L475 144 L479 138 Z" fill="#59626d"/>
  <path d="M540 155 L556 155 L556 100 L544 100" stroke="#59626d" fill="none"/><path d="M546 96 L540 100 L546 104 Z" fill="#59626d"/>
  <text x="560" y="150" font-size="9" fill="#97a1ac">re-check</text>

  <rect x="570" y="72" width="130" height="24" fill="#5c92c7"/>
  <text x="580" y="88" font-size="10" fill="#dde3ea">applied, +1 history</text>
  <path d="M540 84 L566 84" stroke="#97a1ac"/><path d="M564 80 L570 84 L564 88 Z" fill="#97a1ac"/>

  <rect x="570" y="104" width="130" height="24" fill="#454e59"/>
  <text x="580" y="120" font-size="10" fill="#dde3ea">refused: stale, gone</text>
  <path d="M540 116 L566 116" stroke="#97a1ac"/><path d="M564 112 L570 116 L564 120 Z" fill="#97a1ac"/>

  <rect x="570" y="184" width="130" height="24" fill="#454e59"/>
  <text x="580" y="200" font-size="10" fill="#dde3ea">duplicate: original</text>
  <path d="M600 128 L600 180" stroke="#59626d" fill="none"/><path d="M596 178 L600 184 L604 178 Z" fill="#59626d"/>
  <text x="606" y="160" font-size="9" fill="#97a1ac">same op id</text>

  <rect x="20" y="220" width="150" height="24" fill="#6d7681"/>
  <text x="30" y="236" font-size="10" fill="#dde3ea">saving (PATCH queued)</text>
  <rect x="190" y="220" width="90" height="24" fill="#6d7681"/>
  <text x="200" y="236" font-size="10" fill="#dde3ea">saved</text>
  <rect x="300" y="220" width="190" height="24" fill="#6d7681"/>
  <text x="310" y="236" font-size="10" fill="#dde3ea">save failed, rolled back</text>
  <rect x="510" y="220" width="110" height="24" fill="#6d7681"/>
  <text x="520" y="236" font-size="10" fill="#dde3ea">superseded</text>
  <rect x="640" y="220" width="60" height="24" fill="#191e24" stroke="#59626d"/>
  <text x="648" y="236" font-size="10" fill="#97a1ac">draft</text>
  <path d="M635 72 L635 64 L710 64 L710 210 L95 210 L95 216" stroke="#59626d" fill="none"/><path d="M91 214 L95 220 L99 214 Z" fill="#59626d"/>
  <path d="M170 232 L186 232" stroke="#97a1ac"/><path d="M184 228 L190 232 L184 236 Z" fill="#97a1ac"/>
  <path d="M180 244 L180 256 L395 256 L395 248" stroke="#59626d" fill="none"/><path d="M391 250 L395 244 L399 250 Z" fill="#59626d"/>
  <path d="M180 256 L565 256 L565 248" stroke="#59626d" fill="none"/><path d="M561 250 L565 244 L569 250 Z" fill="#59626d"/>

  <text x="20" y="284" font-size="11" fill="#dde3ea">the feed names every bottom-row box; a model reply or private commit never counts as applied</text>
</svg>
