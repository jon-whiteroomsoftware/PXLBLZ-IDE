<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace">
  <defs>
    <marker id="pdb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c92c7"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#14171c"/>

  <text x="40" y="34" font-size="13" fill="#dde3ea">preview state is not hardware state: only explicit sends cross</text>

  <!-- browser container -->
  <rect x="40" y="52" width="400" height="190" fill="#191e24" stroke="#59626d" stroke-width="1.5"/>
  <text x="56" y="74" font-size="11" font-weight="bold" fill="#dde3ea">BROWSER</text>

  <!-- pattern source chip -->
  <rect x="56" y="84" width="368" height="30" fill="#1d232b" stroke="#dde3ea" stroke-width="1"/>
  <text x="68" y="103" font-size="10" font-weight="bold" fill="#dde3ea">Pattern source</text>
  <text x="416" y="103" text-anchor="end" font-size="8" fill="#97a1ac">plain Pixelblaze code</text>

  <!-- PIXELBLAZE deck -->
  <rect x="56" y="122" width="368" height="50" fill="#232a33" stroke="#97a1ac" stroke-width="1"/>
  <text x="68" y="140" font-size="10" font-weight="bold" fill="#dde3ea">PIXELBLAZE settings</text>
  <text x="416" y="140" text-anchor="end" font-size="8" fill="#97a1ac">what the Pattern computes against</text>
  <text x="68" y="160" font-size="9" fill="#97a1ac">map &#183; modeled pixel count &#183; Fill/Contain fit &#183; brightness</text>

  <!-- PREVIEW deck -->
  <rect x="56" y="180" width="368" height="50" fill="#232a33" stroke="#97a1ac" stroke-width="1"/>
  <text x="68" y="198" font-size="10" font-weight="bold" fill="#dde3ea">PREVIEW settings</text>
  <text x="416" y="198" text-anchor="end" font-size="8" fill="#97a1ac">how the browser draws it</text>
  <text x="68" y="218" font-size="9" fill="#97a1ac">renderer &#183; playback speed &#183; light size &#183; diffusion &#183; solidity</text>

  <!-- controller container -->
  <rect x="560" y="52" width="120" height="190" fill="#191e24" stroke="#59626d" stroke-width="1.5"/>
  <text x="620" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#dde3ea">CONTROLLER</text>
  <rect x="572" y="88" width="96" height="34" fill="#1d232b" stroke="#dde3ea" stroke-width="1"/>
  <text x="620" y="103" text-anchor="middle" font-size="8.5" fill="#dde3ea">installed</text>
  <text x="620" y="114" text-anchor="middle" font-size="8.5" fill="#dde3ea">Patterns</text>
  <rect x="572" y="130" width="96" height="34" fill="#1d232b" stroke="#dde3ea" stroke-width="1"/>
  <text x="620" y="145" text-anchor="middle" font-size="8.5" fill="#dde3ea">one shared</text>
  <text x="620" y="156" text-anchor="middle" font-size="8.5" fill="#dde3ea">map slot</text>

  <!-- arrows -->
  <line x1="440" y1="99" x2="556" y2="99" stroke="#5c92c7" stroke-width="1.6" marker-end="url(#pdb-arr)"/>
  <text x="498" y="88" text-anchor="middle" font-size="9" fill="#5c92c7">Run / Save</text>
  <line x1="440" y1="147" x2="556" y2="147" stroke="#5c92c7" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#pdb-arr)"/>
  <text x="498" y="136" text-anchor="middle" font-size="9" fill="#5c92c7">Send map</text>
  <text x="498" y="161" text-anchor="middle" font-size="8" fill="#97a1ac">confirm-first</text>
  <text x="450" y="208" font-size="9" fill="#97a1ac">never leaves</text>
  <text x="450" y="220" font-size="9" fill="#97a1ac">the browser</text>

  <text x="40" y="266" font-size="11" fill="#dde3ea">nothing reaches hardware as a side effect: a push carries the Pattern alone, and</text>
  <text x="40" y="282" font-size="11" fill="#dde3ea">preview brightness is no substitute for physical power planning</text>
</svg>
