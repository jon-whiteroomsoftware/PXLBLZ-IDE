<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c92c7"/></marker></defs>
  <rect width="900" height="500" fill="#14171c"/>
  <text x="36" y="31" font-size="12" font-weight="bold" fill="#dde3ea">map coordinates answer two different questions</text>

  <rect x="36" y="62" width="210" height="76" rx="6" fill="#1d232b" stroke="#dde3ea"/>
  <text x="52" y="87" font-size="12" font-weight="bold" fill="#dde3ea">Map / coordinate view</text>
  <text x="52" y="107" font-size="10.5" fill="#97a1ac">baked array at pixelCount</text>
  <text x="52" y="124" font-size="10.5" fill="#5c92c7">owns sample</text>

  <rect x="36" y="172" width="210" height="76" rx="6" fill="#1d232b" stroke="#dde3ea"/>
  <text x="52" y="197" font-size="12" font-weight="bold" fill="#dde3ea">Geometry / display</text>
  <text x="52" y="217" font-size="10.5" fill="#97a1ac">intrinsic map position or</text>
  <text x="52" y="234" font-size="10.5" fill="#5c92c7">embedding owns pos</text>

  <rect x="36" y="282" width="210" height="76" rx="6" fill="#1d232b" stroke="#dde3ea"/>
  <text x="52" y="307" font-size="12" font-weight="bold" fill="#dde3ea">Pattern capability</text>
  <text x="52" y="327" font-size="10.5" fill="#97a1ac">render / render2D / render3D</text>
  <text x="52" y="344" font-size="10.5" fill="#5c92c7">selects renderer preference</text>

  <rect x="36" y="392" width="210" height="64" rx="6" fill="#1d232b" stroke="#dde3ea"/>
  <text x="52" y="417" font-size="12" font-weight="bold" fill="#dde3ea">Normalization</text>
  <text x="52" y="437" font-size="10.5" fill="#97a1ac">Contain / Fill on sample</text>

  <path d="M246 100 L320 100 L320 226 L362 226" fill="none" stroke="#5c92c7" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M246 210 L362 210" fill="none" stroke="#5c92c7" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M246 320 L320 320 L320 242 L362 242" fill="none" stroke="#5c92c7" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M246 424 L320 424 L320 258 L362 258" fill="none" stroke="#5c92c7" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="366" y="174" width="200" height="104" rx="7" fill="#232a33" stroke="#dde3ea" stroke-width="1.5"/>
  <text x="382" y="201" font-size="12" font-weight="bold" fill="#dde3ea">resolveLayout()</text>
  <text x="382" y="222" font-size="10.5" fill="#97a1ac">correct selection</text>
  <text x="382" y="240" font-size="10.5" fill="#97a1ac">map + display dimension</text>
  <text x="382" y="258" font-size="10.5" fill="#97a1ac">points + draw description</text>

  <line x1="566" y1="210" x2="624" y2="140" stroke="#5c92c7" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="566" y1="242" x2="624" y2="330" stroke="#5c92c7" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="628" y="62" width="236" height="150" rx="7" fill="#1d232b" stroke="#dde3ea"/>
  <text x="644" y="89" font-size="12" font-weight="bold" fill="#dde3ea">Pattern evaluation</text>
  <text x="644" y="112" font-size="10.5" fill="#5c92c7">sample</text>
  <text x="706" y="112" font-size="10.5" fill="#97a1ac">feeds selected renderer</text>
  <text x="644" y="133" font-size="10.5" fill="#dde3ea">render(index)</text>
  <text x="644" y="151" font-size="10.5" fill="#dde3ea">render2D(index, x, y)</text>
  <text x="644" y="169" font-size="10.5" fill="#dde3ea">render3D(index, x, y, z)</text>
  <text x="644" y="194" font-size="10" fill="#97a1ac">missing trailing coords → 0.5</text>

  <rect x="628" y="276" width="236" height="150" rx="7" fill="#1d232b" stroke="#dde3ea"/>
  <text x="644" y="303" font-size="12" font-weight="bold" fill="#dde3ea">WebGL presentation</text>
  <text x="644" y="326" font-size="10.5" fill="#5c92c7">pos</text>
  <text x="680" y="326" font-size="10.5" fill="#97a1ac">places the light</text>
  <text x="644" y="347" font-size="10.5" fill="#dde3ea">2D additive points</text>
  <text x="644" y="365" font-size="10.5" fill="#dde3ea">3D core + glow passes</text>
  <text x="644" y="383" font-size="10.5" fill="#dde3ea">camera · diffusion · solidity</text>
  <text x="644" y="408" font-size="10" fill="#97a1ac">presentation never changes sample</text>

  <text x="450" y="482" text-anchor="middle" font-size="10.5" fill="#97a1ac">the Pattern can sample one coordinate space while the preview draws the same LEDs in another</text>
</svg>
