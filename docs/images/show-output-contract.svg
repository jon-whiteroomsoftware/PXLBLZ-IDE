<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace">
  <defs>
    <marker id="soc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#97a1ac"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#14171c"/>

  <text x="40" y="34" font-size="13" fill="#dde3ea">New Show: a permanent output contract</text>

  <!-- Portable -->
  <rect x="40" y="52" width="310" height="184" fill="#191e24" stroke="#59626d" stroke-width="1.5"/>
  <text x="56" y="74" font-size="11" font-weight="bold" fill="#dde3ea">PORTABLE</text>
  <text x="334" y="74" text-anchor="end" font-size="8" fill="#97a1ac">LED-resolution independent</text>

  <rect x="160" y="86" width="70" height="22" fill="#1d232b" stroke="#5c92c7" stroke-width="1.2"/>
  <text x="195" y="101" text-anchor="middle" font-size="9" fill="#dde3ea">Show</text>

  <line x1="175" y1="108" x2="105" y2="136" stroke="#97a1ac" stroke-width="1" marker-end="url(#soc-arr)"/>
  <line x1="195" y1="108" x2="195" y2="150" stroke="#97a1ac" stroke-width="1" marker-end="url(#soc-arr)"/>
  <line x1="215" y1="108" x2="285" y2="136" stroke="#97a1ac" stroke-width="1" marker-end="url(#soc-arr)"/>

  <!-- square 5x5 -->
  <g fill="#9dbede">
