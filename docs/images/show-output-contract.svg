  <!-- wide 8x2 -->
  <g fill="#9dbede">
    <circle cx="153" cy="164" r="3"/><circle cx="167" cy="164" r="3"/><circle cx="181" cy="164" r="3"/><circle cx="195" cy="164" r="3"/><circle cx="209" cy="164" r="3"/><circle cx="223" cy="164" r="3"/><circle cx="237" cy="164" r="3"/><circle cx="251" cy="164" r="3"/>
    <circle cx="153" cy="178" r="3"/><circle cx="167" cy="178" r="3"/><circle cx="181" cy="178" r="3"/><circle cx="195" cy="178" r="3"/><circle cx="209" cy="178" r="3"/><circle cx="223" cy="178" r="3"/><circle cx="237" cy="178" r="3"/><circle cx="251" cy="178" r="3"/>
