    <circle cx="70" cy="164" r="3"/><circle cx="84" cy="164" r="3"/><circle cx="98" cy="164" r="3"/><circle cx="112" cy="164" r="3"/><circle cx="126" cy="164" r="3"/>
    <circle cx="70" cy="178" r="3"/><circle cx="84" cy="178" r="3"/><circle cx="98" cy="178" r="3"/><circle cx="112" cy="178" r="3"/><circle cx="126" cy="178" r="3"/>
    <circle cx="70" cy="192" r="3"/><circle cx="84" cy="192" r="3"/><circle cx="98" cy="192" r="3"/><circle cx="112" cy="192" r="3"/><circle cx="126" cy="192" r="3"/>
