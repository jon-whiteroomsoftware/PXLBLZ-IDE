    <circle cx="474" cy="162" r="3"/><circle cx="490" cy="162" r="3"/><circle cx="506" cy="162" r="3"/><circle cx="522" cy="162" r="3"/><circle cx="538" cy="162" r="3"/><circle cx="554" cy="162" r="3"/><circle cx="570" cy="162" r="3"/>
