  <g fill="#9dbede">
    <circle cx="286" cy="150" r="3"/><circle cx="300" cy="150" r="3"/><circle cx="314" cy="150" r="3"/>
    <circle cx="286" cy="164" r="3"/><circle cx="300" cy="164" r="3"/><circle cx="314" cy="164" r="3"/>
    <circle cx="286" cy="178" r="3"/><circle cx="300" cy="178" r="3"/><circle cx="314" cy="178" r="3"/>
    <circle cx="286" cy="192" r="3"/><circle cx="300" cy="192" r="3"/><circle cx="314" cy="192" r="3"/>
    <circle cx="286" cy="206" r="3"/><circle cx="300" cy="206" r="3"/><circle cx="314" cy="206" r="3"/>
  </g>
  <text x="195" y="226" text-anchor="middle" font-size="9" fill="#97a1ac">any compatible 2D mapped surface</text>

  <!-- Installation -->
  <rect x="370" y="52" width="310" height="184" fill="#191e24" stroke="#59626d" stroke-width="1.5"/>
  <text x="386" y="74" font-size="11" font-weight="bold" fill="#dde3ea">INSTALLATION</text>
  <text x="664" y="74" text-anchor="end" font-size="8" fill="#97a1ac">one pixel count, one output map</text>

  <rect x="490" y="86" width="70" height="22" fill="#1d232b" stroke="#5c92c7" stroke-width="1.2"/>
  <text x="525" y="101" text-anchor="middle" font-size="9" fill="#dde3ea">Show</text>
  <line x1="525" y1="108" x2="525" y2="132" stroke="#97a1ac" stroke-width="1" marker-end="url(#soc-arr)"/>

  <!-- one fixed build, zone-colored ranges -->
  <g fill="#5c92c7">
    <circle cx="410" cy="146" r="3"/><circle cx="426" cy="146" r="3"/><circle cx="442" cy="146" r="3"/><circle cx="458" cy="146" r="3"/>
    <circle cx="410" cy="162" r="3"/><circle cx="426" cy="162" r="3"/><circle cx="442" cy="162" r="3"/><circle cx="458" cy="162" r="3"/>
