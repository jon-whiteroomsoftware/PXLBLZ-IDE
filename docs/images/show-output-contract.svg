    <circle cx="474" cy="194" r="3"/><circle cx="490" cy="194" r="3"/><circle cx="506" cy="194" r="3"/><circle cx="522" cy="194" r="3"/><circle cx="538" cy="194" r="3"/><circle cx="554" cy="194" r="3"/><circle cx="570" cy="194" r="3"/>
  </g>
  <g fill="#9dbede">
    <circle cx="586" cy="146" r="3"/><circle cx="602" cy="146" r="3"/><circle cx="618" cy="146" r="3"/><circle cx="634" cy="146" r="3"/>
    <circle cx="586" cy="162" r="3"/><circle cx="602" cy="162" r="3"/><circle cx="618" cy="162" r="3"/><circle cx="634" cy="162" r="3"/>
    <circle cx="586" cy="178" r="3"/><circle cx="602" cy="178" r="3"/><circle cx="618" cy="178" r="3"/><circle cx="634" cy="178" r="3"/>
    <circle cx="586" cy="194" r="3"/><circle cx="602" cy="194" r="3"/><circle cx="618" cy="194" r="3"/><circle cx="634" cy="194" r="3"/>
  </g>
  <text x="525" y="226" text-anchor="middle" font-size="9" fill="#97a1ac">physical zone ranges + Controller targeting</text>

  <text x="40" y="266" font-size="11" fill="#dde3ea">the contract is chosen at New Show, stays visible in the timeline header, and decides</text>
  <text x="40" y="282" font-size="11" fill="#dde3ea">what Zones mean; Show setup supports outputs through 2,000 pixels</text>
</svg>
