<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace">
  <rect width="720" height="250" fill="#14171c"/>

  <text x="40" y="34" font-size="13" fill="#dde3ea">one 2,000-pixel Redline frame, before optimization: 336 ms</text>

  <!-- legend -->
  <rect x="40" y="52" width="14" height="11" fill="#6d7681"/>
  <text x="60" y="62" font-size="10" fill="#97a1ac">output transmission (the wire)</text>
  <rect x="286" y="52" width="14" height="11" fill="#5c92c7"/>
  <text x="306" y="62" font-size="10" fill="#97a1ac">Show machinery</text>
  <rect x="452" y="52" width="14" height="11" fill="#454e59"/>
  <text x="472" y="62" font-size="10" fill="#97a1ac">member Pattern work</text>

  <!-- stacked bar: 60.353 / 142.547 / 133.576 of 336.476 ms over 600px -->
  <rect x="40" y="96" width="108" height="34" fill="#6d7681"/>
  <rect x="148" y="96" width="254" height="34" fill="#5c92c7"/>
  <rect x="402" y="96" width="238" height="34" fill="#454e59"/>

  <text x="94" y="150" text-anchor="middle" font-size="10" fill="#97a1ac">60.4 ms</text>
  <text x="275" y="150" text-anchor="middle" font-size="10" fill="#97a1ac">142.5 ms</text>
  <text x="521" y="150" text-anchor="middle" font-size="10" fill="#97a1ac">133.6 ms</text>

  <text x="94" y="166" text-anchor="middle" font-size="10" fill="#97a1ac">18%</text>
  <text x="275" y="166" text-anchor="middle" font-size="10" fill="#97a1ac">42%</text>
  <text x="521" y="166" text-anchor="middle" font-size="10" fill="#97a1ac">40%</text>

  <text x="40" y="204" font-size="11" fill="#dde3ea">the wire is fixed physics (~30 &#181;s/pixel on native serial); routing, transitions,</text>
  <text x="40" y="220" font-size="11" fill="#dde3ea">and Pattern evaluations are the parts a compiler can attack</text>
</svg>
