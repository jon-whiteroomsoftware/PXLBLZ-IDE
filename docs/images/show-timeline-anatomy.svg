<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace">
  <rect width="720" height="300" fill="#14171c"/>

  <text x="40" y="34" font-size="13" fill="#dde3ea">the timeline: Clips on Layers, Layers inside Zones, one shared clock</text>

  <!-- ruler -->
  <text x="150" y="54" text-anchor="middle" font-size="8" fill="#97a1ac">0s</text>
  <text x="375" y="54" text-anchor="middle" font-size="8" fill="#97a1ac">30s</text>
  <text x="600" y="54" text-anchor="middle" font-size="8" fill="#97a1ac">60s</text>
  <line x1="150" y1="60" x2="600" y2="60" stroke="#97a1ac" stroke-width="1"/>
  <line x1="150" y1="60" x2="150" y2="56" stroke="#97a1ac" stroke-width="1"/>
  <line x1="225" y1="60" x2="225" y2="56" stroke="#97a1ac" stroke-width="1"/>
  <line x1="300" y1="60" x2="300" y2="56" stroke="#97a1ac" stroke-width="1"/>
  <line x1="375" y1="60" x2="375" y2="56" stroke="#97a1ac" stroke-width="1"/>
  <line x1="450" y1="60" x2="450" y2="56" stroke="#97a1ac" stroke-width="1"/>
  <line x1="525" y1="60" x2="525" y2="56" stroke="#97a1ac" stroke-width="1"/>
  <line x1="600" y1="60" x2="600" y2="56" stroke="#97a1ac" stroke-width="1"/>

  <!-- Layouts lane -->
  <rect x="150" y="70" width="450" height="14" fill="#191e24" stroke="#59626d" stroke-width="1"/>
  <line x1="460" y1="70" x2="460" y2="84" stroke="#59626d" stroke-width="1"/>
  <text x="300" y="80" text-anchor="middle" font-size="8" fill="#97a1ac">Full surface</text>
  <text x="535" y="80" text-anchor="middle" font-size="8" fill="#97a1ac">Stripes</text>
  <path d="M460,72 L465,77 L460,82 L455,77 z" fill="#5c92c7"/>

  <!-- Zone A rail -->
  <rect x="40" y="92" width="100" height="72" fill="#191e24" stroke="#59626d" stroke-width="1"/>
  <rect x="52" y="102" width="11" height="8" fill="#9dbede"/>
  <text x="69" y="110" font-size="10" fill="#dde3ea">Zone A</text>

  <!-- Zone A, base Layer -->
  <rect x="150" y="92" width="450" height="26" fill="#1d232b"/>
  <rect x="160" y="96" width="280" height="18" fill="#454e59" stroke="#97a1ac" stroke-width="1"/>
  <text x="300" y="108" text-anchor="middle" font-size="9" fill="#dde3ea">Clip</text>

  <!-- property band -->
  <rect x="150" y="122" width="450" height="10" fill="#191e24"/>
  <polyline points="160,130 240,125 320,128 400,124 440,129" fill="none" stroke="#9dbede" stroke-width="1.2"/>

  <!-- Zone A, overlay Layer -->
  <rect x="150" y="138" width="450" height="26" fill="#1d232b"/>
  <rect x="250" y="142" width="230" height="18" fill="#454e59" stroke="#97a1ac" stroke-width="1"/>
  <text x="365" y="154" text-anchor="middle" font-size="9" fill="#dde3ea">Clip</text>

  <!-- Zone B rail -->
  <rect x="40" y="172" width="100" height="36" fill="#191e24" stroke="#59626d" stroke-width="1"/>
  <rect x="52" y="184" width="11" height="8" fill="#6d7681"/>
  <text x="69" y="192" font-size="10" fill="#dde3ea">Zone B</text>

  <!-- Zone B Layer with Transition junction -->
  <rect x="150" y="172" width="450" height="36" fill="#1d232b"/>
  <rect x="160" y="180" width="190" height="18" fill="#454e59" stroke="#97a1ac" stroke-width="1"/>
  <text x="255" y="192" text-anchor="middle" font-size="9" fill="#dde3ea">Clip</text>
  <path d="M353,180 L367,180 L360,189 z" fill="#5c92c7"/>
  <path d="M353,198 L367,198 L360,189 z" fill="#5c92c7"/>
  <rect x="370" y="180" width="190" height="18" fill="#454e59" stroke="#97a1ac" stroke-width="1"/>
  <text x="465" y="192" text-anchor="middle" font-size="9" fill="#dde3ea">Clip</text>

  <!-- playhead -->
  <path d="M430,54 L440,54 L435,62 z" fill="#5c92c7"/>
  <line x1="435" y1="60" x2="435" y2="208" stroke="#5c92c7" stroke-width="1.4"/>

  <!-- annotations -->
  <line x1="602" y1="62" x2="606" y2="62" stroke="#59626d" stroke-width="1"/>
  <text x="610" y="65" font-size="9" fill="#97a1ac">ruler + playhead</text>
  <line x1="602" y1="77" x2="606" y2="77" stroke="#59626d" stroke-width="1"/>
  <text x="610" y="80" font-size="9" fill="#97a1ac">Layouts lane</text>
  <line x1="602" y1="105" x2="606" y2="105" stroke="#59626d" stroke-width="1"/>
  <text x="610" y="108" font-size="9" fill="#97a1ac">Clips on a Layer</text>
  <line x1="602" y1="127" x2="606" y2="127" stroke="#59626d" stroke-width="1"/>
  <text x="610" y="130" font-size="9" fill="#97a1ac">property band</text>
  <line x1="602" y1="151" x2="606" y2="151" stroke="#59626d" stroke-width="1"/>
  <text x="610" y="154" font-size="9" fill="#97a1ac">overlay Layer</text>
  <line x1="90" y1="210" x2="90" y2="222" stroke="#59626d" stroke-width="1"/>
  <text x="90" y="234" text-anchor="middle" font-size="9" fill="#97a1ac">Zone rail</text>
  <line x1="360" y1="210" x2="360" y2="222" stroke="#59626d" stroke-width="1"/>
  <text x="360" y="234" text-anchor="middle" font-size="9" fill="#97a1ac">Transition junction</text>

  <text x="40" y="266" font-size="11" fill="#dde3ea">a Show is Zones &#8594; Layers &#8594; Clips; Transitions join adjacent Clips and property</text>
  <text x="40" y="282" font-size="11" fill="#dde3ea">bands animate values &#8212; select any element to edit it in its Entity Detail Panel</text>
</svg>
